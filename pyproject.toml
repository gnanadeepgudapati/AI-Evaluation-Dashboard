[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() pattern relies on call-in-default-arg
    "E501",  # long judge-prompt strings and test literals are more readable unwrapped
]

[tool.ruff.lint.per-file-ignores]
"providers/*_adapter.py" = ["BLE001"]  # adapters intentionally catch broad Exception to
                                        # normalize any SDK error into ModelResponse.error
                                        # (a provider failure must never crash a run)

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
